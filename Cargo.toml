[package]
name = "webdav-server"

# When releasing to crates.io:
# - Update html_root_url in src/main.rs
# - Update CHANGELOG.md.
# - Create git tag webdav-server-0.x.y
version = "0.4.0"

description = "webdav/http server with support for user accounts"
documentation = "https://docs.rs/webdav-server"
repository = "https://github.com/ArcticLampyrid/webdav-server-rs"
authors = [
    "Miquel van Smoorenburg <mike@langeraar.net>",
    "alampy <https://alampy.com>",
]
edition = "2021"
license = "Apache-2.0"
categories = ["filesystem"]

[workspace]
members = [ "fs_quota", "pam" ]

[features]
# By default, the "pam" and "quota" features are enabled.
#
# Some systems do not have pam (like OpenBSD), so to compile this
# package without pam but with quota use:
#
#     cargo build --release --no-default-features --features=quota
#
default = [ "pam", "quota" ]

# dependencies for the feature.
pam = [ "pam-sandboxed" ]
quota = [ "fs-quota" ]

[dependencies]
bytes = "1.12"
clap = { version = "4.6.9", features = [ "cargo" ] }
dav-server = { version = "0.12.0", default-features = false, features = [ "localfs", "proppatch" ] }
env_logger = "0.11.12"
fs-quota = { path = "fs_quota", version = "0.1.0", optional = true }
futures = "0.3.34"
headers = "0.4.2"
http = "1.5"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = [ "http1", "http2", "server" ] }
hyper-util = { version = "0.1.21", features = [ "tokio", "server", "server-auto", "http1", "http2" ] }
lazy_static = "1.5.1"
libc = "0.2.191"
log = "0.4.35"
pam-sandboxed = { path = "pam", version = "0.2.0", optional = true }
pwhash = "1.0.0"
regex = "1.13"
rustls-pki-types = { version = "1.16", features = [ "std" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
socket2 = { version = "0.6.5", features = [ "all" ] }
tokio = { version = "1.54", features = [ "full" ] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [ "logging", "ring", "tls12" ] }
toml = "1.2"
