[package]
name = "fs-quota"

# When releasing to crates.io:
# - Update html_root_url in src/lib.rs
# - Update CHANGELOG.md.
# - Run: cargo readme > README.md
# - Create git tag fs-quota-0.x.y
version = "0.1.0"

documentation = "https://docs.rs/fs-quota"
repository = "https://github.com/ArcticLampyrid/webdav-server-rs"
homepage = "https://github.com/ArcticLampyrid/webdav-server-rs/tree/main/fs_quota"
authors = [
    "Miquel van Smoorenburg <mike@langeraar.net>",
    "alampy <https://alampy.com>",
]
edition = "2021"
license = "Apache-2.0"
keywords = ["quota"]
categories = ["filesystem"]

[features]
nfs = []
default = ["nfs"]

[build-dependencies]
cc = "1.11.3"

[dependencies]
libc = "0.2.191"
log = "0.4.35"
