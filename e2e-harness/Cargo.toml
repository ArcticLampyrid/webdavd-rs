[package]
name = "e2e-harness"
description = "VM-based end-to-end test harness for webdavd"
version = "0.0.0"
edition = "2021"
publish = false

# Plain HTTP to the local container engine: no TLS stack.
[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8", default-features = false, features = [ "http1", "tokio" ] }
base64 = "0.22"
clap = { version = "4.6", features = [ "derive", "env" ] }
include_dir = "0.7.4"
libtest-mimic = "0.8"
serde = { version = "1.0", features = [ "derive" ] }
serde-saphyr = "2.1"
sha2 = "0.11"
tempfile = "3.27"
testcontainers = { version = "0.28", default-features = false }
tokio = { version = "1.54", features = [ "fs", "macros", "net", "rt-multi-thread", "sync", "time" ] }
tokio-util = { version = "0.7", features = [ "io" ] }
