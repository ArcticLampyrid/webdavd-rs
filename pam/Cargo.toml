[package]
name = "pam-sandboxed"

# When releasing to crates.io:
# - Update html_root_url in src/lib.rs
# - Update CHANGELOG.md.
# - Run: cargo readme > README.md
# - Create git tag pam-sandboxed-0.x.y
version = "0.2.0"

documentation = "https://docs.rs/pam-sandboxed"
repository = "https://github.com/ArcticLampyrid/webdav-server-rs"
homepage = "https://github.com/ArcticLampyrid/webdav-server-rs/tree/main/pam"
authors = [
    "Miquel van Smoorenburg <mike@langeraar.net>",
    "alampy <https://alampy.com>",
]
edition = "2021"
license = "Apache-2.0"
categories = ["authentication"]

[build-dependencies]
cc = "1.11.3"

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = [ "std", "serde" ] }
env_logger = "0.11.12"
futures = "0.3.34"
libc = "0.2.191"
log = "0.4.35"
serde = { version = "1.0.229", features = [ "derive" ] }
threadpool = "1.8.1"
tokio = { version = "1.54", features = [ "io-util", "net", "rt" ] }

[dev-dependencies]
tokio = { version = "1.54", features = [ "io-util", "net", "rt", "rt-multi-thread" ] }
