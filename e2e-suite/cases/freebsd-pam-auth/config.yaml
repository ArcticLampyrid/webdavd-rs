# PAM gates access before the filesystem handler runs as the service account.
vm-profile: freebsd-14
args: [FREEBSD_WEBDAVD_PATH]

steps:
  - name: configure PAM and local accounts
    type: script
    run: |
      set -eux
      pw groupadd clients
      printf '%s\n' alice-e2e-pw | pw useradd alice -u 2000 -g clients -h 0
      printf '%s\n' lowuid-e2e-pw | pw useradd lowuid -u 1999 -g clients -h 0
      printf '%s\n' expired-e2e-pw | pw useradd expired -u 2001 -g clients -e 01-Jan-2020 -h 0
      printf '%s\n' 'auth required pam_unix.so' 'account required pam_unix.so' >/etc/pam.d/webdavd

      mkdir -p /srv/webdav
      install -d -o nobody -m 0700 /srv/webdav/private
      printf 'service account only\n' >/srv/webdav/private/probe.txt
      chown nobody /srv/webdav/private/probe.txt
      chmod 0400 /srv/webdav/private/probe.txt

  - name: start webdavd
    type: script
    run: |
      set -eux
      mkdir -p /usr/local/bin /usr/local/etc
      curl -fsS -o /usr/local/bin/webdavd "$WORKSPACE_BASE_URL/$FREEBSD_WEBDAVD_PATH"
      chmod 0755 /usr/local/bin/webdavd
      curl -fsS -o /usr/local/etc/webdavd.toml "$ASSETS_BASE_URL/webdavd.toml"
      daemon -o /dev/console /usr/local/bin/webdavd -c /usr/local/etc/webdavd.toml
      for _ in $(seq 30); do
          curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0
          sleep 1
      done
      exit 1

  - name: check PAM authentication without UID switching
    type: script
    run: |
      set -eux
      curl -fsS -o test.py "$ASSETS_BASE_URL/test.py"
      chmod 0755 test.py
      ./test.py
