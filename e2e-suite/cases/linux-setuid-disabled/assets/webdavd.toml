# webdavd configuration of the case linux-setuid-disabled.
#
# The tmpfs, but file access and quota lookups use the server uid.

[server]
listen = "127.0.0.1:8080"
# nobody/nogroup
uid = 65534
gid = 65534

[accounts]
auth-type = "pam"
acct-type = "unix"

[pam]
service = "webdavd"
cache-timeout = 0

[unix]
min-uid = 1000
supplementary-groups = true

[[location]]
route = [ "/nosetuid(/*path)" ]
methods = [ "webdav-ro" ]
auth = "true"
handler = "filesystem"
setuid = false
directory = "/srv/webdav/tmpfs"
