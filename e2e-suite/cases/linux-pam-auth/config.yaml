# PAM authentication, minimum UID, and filesystem access as the logged-in user.
vm-profile: debian-13
disks: [128M]

# LINUX_WEBDAVD_PATH: path of the webdavd binary in the workspace. It must run
# with the glibc of Debian 13.
args: [LINUX_WEBDAVD_PATH]

steps:
  - name: add accounts
    type: script
    run: |
      set -eux
      groupadd writers
      # alice is exactly at the configured min-uid; lowuid is just below it.
      useradd -U -u 2000 -G writers alice
      useradd -U -u 2001 bob
      useradd -U -u 2002 carol
      useradd -U -u 1999 lowuid
      for user in alice bob carol lowuid; do
          printf '%s:%s-e2e-pw\n' "$user" "$user"
      done | chpasswd
      printf '%s\n' 'auth    required pam_unix.so' 'account required pam_unix.so' >/etc/pam.d/webdavd

  - name: set up ext4 with a POSIX ACL
    type: script
    run: |
      set -eux
      DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends acl
      mkfs.ext4 -q /dev/vdb
      root=/srv/webdav/groups
      mkdir -p "$root"
      mount -o acl /dev/vdb "$root"
      chmod 0755 "$root"
      install -d -m 0700 "$root/shared"
      setfacl -m g:writers:rwx,u:bob:r-x "$root/shared"
      printf 'shared\n' >"$root/shared/seed.txt"
      chmod 0644 "$root/shared/seed.txt"

  - name: start webdavd
    type: script
    run: |
      set -eux
      curl -fsS -o /usr/local/bin/webdavd "$WORKSPACE_BASE_URL/$LINUX_WEBDAVD_PATH"
      chmod 0755 /usr/local/bin/webdavd
      curl -fsS -o /etc/webdavd.toml "$ASSETS_BASE_URL/webdavd.toml"
      systemd-run --unit=webdavd --setenv=RUST_LOG=webdavd=info \
          --property=StandardOutput=journal+console \
          /usr/local/bin/webdavd -c /etc/webdavd.toml
      # Any HTTP status: webdavd is ready.
      for _ in $(seq 30); do
          curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0
          sleep 1
      done
      exit 1

  - name: check authentication, identity, and ACL enforcement
    type: script
    run: |
      set -eux
      curl -fsS -o test.py "$ASSETS_BASE_URL/test.py"
      chmod 0755 test.py
      ./test.py
