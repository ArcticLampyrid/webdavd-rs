# UFS user quota: without uid switching, /ufs reports the filesystem space
# (128 MiB disk), but the kernel enforces the user quota of the server account
# alice (uid 2000, see assets/webdavd.toml). alice has a 4 MiB soft and 8 MiB
# hard limit, and the kernel stops all writes at the hard limit.
# The account and limits must agree with assets/test.py.
vm-profile: freebsd-14

# /dev/vtbd1: UFS with user quota.
disks: [128M]

# FREEBSD_WEBDAVD_PATH: path of the FreeBSD webdavd binary in the workspace.
args: [FREEBSD_WEBDAVD_PATH]

steps:
  - name: add account
    type: script
    run: |
      set -eux
      pw groupadd alice -g 2000
      pw useradd alice -u 2000 -g alice -m -s /bin/sh

  - name: set up UFS with user quota
    type: script
    run: |
      set -eux
      newfs -U /dev/vtbd1
      mkdir -p /srv/webdav/ufs
      # The quota tools find the quota file through the fstab entry.
      echo '/dev/vtbd1 /srv/webdav/ufs ufs rw,userquota 0 0' >>/etc/fstab
      mount /srv/webdav/ufs
      # Writable for all users, like /tmp.
      chmod 1777 /srv/webdav/ufs
      quotacheck -u /srv/webdav/ufs
      quotaon -u /srv/webdav/ufs
      edquota -u -e '/srv/webdav/ufs:4M:8M' alice

  - name: start webdavd
    type: script
    run: |
      set -eux
      mkdir -p /usr/local/bin /usr/local/etc
      curl -fsS -o /usr/local/bin/webdavd "$WORKSPACE_BASE_URL/$FREEBSD_WEBDAVD_PATH"
      chmod 0755 /usr/local/bin/webdavd
      curl -fsS -o /usr/local/etc/webdavd.toml "$ASSETS_BASE_URL/webdavd.toml"
      daemon -o /dev/console /usr/local/bin/webdavd -c /usr/local/etc/webdavd.toml
      # Any HTTP status: webdavd is ready.
      for _ in $(seq 30); do
          curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0
          sleep 1
      done
      exit 1

  - name: check quota
    type: script
    run: |
      set -eux
      curl -fsS -o test.py "$ASSETS_BASE_URL/test.py"
      chmod 0755 test.py
      ./test.py
